; Queue worker for the Money app.
;
; Install:
;   sudo cp deploy/supervisor/money-worker.conf /etc/supervisor/conf.d/money-worker.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status money-worker:*
;
; After every deploy the worker must be restarted so it picks up new code:
;   php artisan queue:restart
;
; The scheduler is a separate concern; add this line to the deploy user's crontab:
;   * * * * * cd /var/www/money && php artisan schedule:run >> /dev/null 2>&1

[program:money-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/money
command=php /var/www/money/artisan queue:work database --queue=default --tries=3 --backoff=10 --sleep=3 --max-time=3600 --max-jobs=1000
autostart=true
autorestart=true
; Give in-flight jobs time to finish instead of killing them mid-send.
stopwaitsecs=120
stopasgroup=true
killasgroup=true
user=www-data
; Two workers comfortably cover the current volume (reset PINs and due-date
; notifications). Raise this before raising server size.
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/money/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
